name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Identify toolchain
        id: toolchain
        run: |
          toolchain_key="$(swift --version | shasum -a 256 | cut -c1-12)"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift build products
        uses: actions/cache@v6
        with:
          path: .build
          key: swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-

      - name: Test Swift packages
        run: swift test

      - name: Test product corpus
        run: node --test ProductCorpus/tests/scenarios.test.mjs

  app-bundle:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Identify toolchain
        id: toolchain
        run: |
          toolchain_key="$({ swift --version; xcodebuild -version; } | shasum -a 256 | cut -c1-12)"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode dependencies and build products
        uses: actions/cache@v6
        with:
          path: |
            .xcode-build/Build
            .xcode-build/ModuleCache.noindex
            .xcode-build/SDKStatCaches.noindex
            .xcode-build/SourcePackages
          key: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-

      - name: Build app bundle
        env:
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh

      - name: Verify app and Sparkle signatures
        run: |
          test -d dist/Natter.app/Contents/Frameworks/Sparkle.framework
          codesign --verify --deep --strict --verbose=1 dist/Natter.app

      - name: Verify the app launches
        run: |
          dist/Natter.app/Contents/MacOS/Natter & PID=$!
          sleep 6
          if kill -0 $PID 2>/dev/null; then
            kill $PID
          else
            echo "::error::Natter exited during launch"
            exit 1
          fi
